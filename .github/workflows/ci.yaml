name: PySpark CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      # uv will automatically create a temporary environment 
      # and install these based on your pyproject.toml or the arguments
      - name: Run Tests
        run: uv run --with pytest --with pyspark pytest tests/